<section class="faq" id="faq">
  <div class="faq__container">
    <div class="faq__header">
      <span class="faq__badge">{{ 'faq.badge' | translate }}</span>
      <h2 class="faq__title" [innerHTML]="'faq.title' | translate"></h2>
      <p class="faq__subtitle">{{ 'faq.subtitle' | translate }}</p>
    </div>

    <div class="faq__list">
      @for (faq of faqs; track faq.q; let i = $index) {
        <div class="faq__item" [class.faq__item--open]="openIndex() === i">
          <button class="faq__question" (click)="toggle(i)">
            <span class="faq__icon">
              @if (faq.iconType === 'logo') {
                <img src="DiggiDuell_App_Logo.svg" alt="DiggiDuell" class="faq__logo">
              } @else {
                @switch (faq.icon) {
                  @case ('cpu') {
                    <!-- AI / CPU -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                      <rect x="9" y="9" width="6" height="6"></rect>
                      <line x1="9" y1="1" x2="9" y2="4"></line>
                      <line x1="15" y1="1" x2="15" y2="4"></line>
                      <line x1="9" y1="20" x2="9" y2="23"></line>
                      <line x1="15" y1="20" x2="15" y2="23"></line>
                      <line x1="20" y1="9" x2="23" y2="9"></line>
                      <line x1="20" y1="15" x2="23" y2="15"></line>
                      <line x1="1" y1="9" x2="4" y2="9"></line>
                      <line x1="1" y1="15" x2="4" y2="15"></line>
                    </svg>
                  }
                  @case ('swords') {
                    <!-- Crossed swords / Duell -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path>
                      <path d="M13 19l6-6"></path>
                      <path d="M16 16l4 4"></path>
                      <path d="M9.5 6.5L21 18v3h-3L6.5 9.5"></path>
                      <path d="M5 8l6-6"></path>
                      <path d="M8 5L4 1"></path>
                    </svg>
                  }
                  @case ('book') {
                    <!-- Open book -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                    </svg>
                  }
                  @case ('gift') {
                    <!-- Free / Gift -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="8" width="18" height="4" rx="1"></rect>
                      <path d="M12 8v13"></path>
                      <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"></path>
                      <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"></path>
                    </svg>
                  }
                  @case ('brain') {
                    <!-- Brain / Spaced Repetition -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 2a4 4 0 0 1 4 4 4 4 0 0 1 2 3.5 4 4 0 0 1 0 5 4 4 0 0 1-2 3.5 4 4 0 0 1-4 4 4 4 0 0 1-4-4 4 4 0 0 1-2-3.5 4 4 0 0 1 0-5A4 4 0 0 1 8 6a4 4 0 0 1 4-4z"></path>
                      <path d="M12 2v20"></path>
                      <path d="M8 6c2 1 4 1 4 1"></path>
                      <path d="M6 9.5c2 .5 6 .5 6 .5"></path>
                      <path d="M6 14.5c2-.5 6-.5 6-.5"></path>
                      <path d="M8 18c2-1 4-1 4-1"></path>
                    </svg>
                  }
                  @case ('trophy') {
                    <!-- Trophy / Competition -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                      <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                      <path d="M4 22h16"></path>
                      <path d="M10 22V18a2 2 0 0 0-2-2H6a2 2 0 0 1-2-2V4h16v10a2 2 0 0 1-2 2h-2a2 2 0 0 0-2 2v4"></path>
                    </svg>
                  }
                  @case ('graduation') {
                    <!-- Graduation cap -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                      <path d="M6 12v5c0 2 3 3 6 3s6-1 6-3v-5"></path>
                    </svg>
                  }
                  @case ('shield') {
                    <!-- Shield / Security -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                      <path d="M9 12l2 2 4-4"></path>
                    </svg>
                  }
                  @case ('rocket') {
                    <!-- Rocket / Get started -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
                      <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
                      <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path>
                      <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>
                    </svg>
                  }
                }
              }
            </span>
            <span class="faq__q-text">{{ faq.q | translate }}</span>
            <span class="faq__toggle">
              <svg class="faq__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </button>
          <div class="faq__answer-wrapper">
            <div class="faq__answer">
              <p>{{ faq.a | translate }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
