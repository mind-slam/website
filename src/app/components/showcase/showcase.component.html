<section class="showcase" id="showcase">
  <!-- Parallax Background Image -->
  <div class="showcase__parallax-bg" [style.transform]="'translateY(' + parallaxOffset + 'px)'">
    <img
      src="student_playing_mind-slam.png"
      alt="Student nutzt DiggiDuell zum Lernen"
      class="showcase__parallax-image"
    >
    <div class="showcase__parallax-overlay"></div>
  </div>

  <div class="showcase__container">
    <!-- Text Content - Centered over parallax -->
    <div class="showcase__content">
      <span class="showcase__badge">{{ 'showcase.badge' | translate }}</span>
      <h2 class="showcase__title" [innerHTML]="'showcase.title' | translate">
      </h2>
      <p class="showcase__description">
        {{ 'showcase.desc' | translate }}
      </p>
      <ul class="showcase__features">
        <li>
          <span class="showcase__feature-icon">⚡</span>
          <span>{{ 'showcase.feature1' | translate }}</span>
        </li>
        <li>
          <span class="showcase__feature-icon">🎯</span>
          <span>{{ 'showcase.feature2' | translate }}</span>
        </li>
        <li>
          <span class="showcase__feature-icon">📈</span>
          <span>{{ 'showcase.feature3' | translate }}</span>
        </li>
      </ul>
    </div>
  </div>
</section>
